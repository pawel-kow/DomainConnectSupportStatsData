# Trigger the statistics site deploy whenever a new export release lands on main.
# Secret SITE_DEPLOY_TOKEN: fine-grained PAT, only pawel-kow/DomainConnectSupportStats,
# "Actions: read and write", nothing else. The site's deploy.yml workflow_dispatch path
# deploys the latest site release with the current data (DomainConnectScanner#236).
name: Notify site

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - .github/**

permissions: {}

concurrency:
  group: notify-site
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch the site deploy
        env:
          TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret SITE_DEPLOY_TOKEN is not set."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/pawel-kow/DomainConnectSupportStats/actions/workflows/deploy.yml/dispatches \
            -d '{"ref":"main"}'
          echo "Dispatched site deploy (deploy.yml @ main)" >> "$GITHUB_STEP_SUMMARY"
